<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 - Contact Us · 艾利姆 Allium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft Yaheiti', 'Helvetica Neue', sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 40px;
    width: 100%;
    max-width: 600px;
  }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    font-size: 24px;
    color: #2d5a27;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .header p { color: #888; font-size: 14px; }
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
    box-sizing: border-box;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #2d5a27;
  }
  .form-group textarea { resize: vertical; min-height: 120px; }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #2d5a27;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover { background: #3d7a35; }
  .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
  .status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    display: none;
  }
  .status.success { background: #e8f5e9; color: #2d5a27; display: block; }
  .status.error { background: #ffebee; color: #c62828; display: block; }

  /* ========== SUCCESS OVERLAY ========== */
  #successOverlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(45, 90, 39, 0.95);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #successOverlay.show {
    display: flex;
  }
  .success-inner {
    text-align: center;
    color: #fff;
    padding: 40px;
    max-width: 520px;
  }
  .success-check {
    font-size: 72px;
    margin-bottom: 16px;
    animation: popIn 0.4s ease;
  }
  .success-title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 4px;
    animation: fadeIn 0.5s ease 0.2s both;
  }
  .success-subtitle {
    font-size: 16px;
    margin-bottom: 32px;
    opacity: 0.9;
    letter-spacing: 2px;
    animation: fadeIn 0.5s ease 0.35s both;
  }
  .success-divider {
    width: 60px;
    height: 2px;
    background: rgba(255,255,255,0.4);
    margin: 0 auto 32px;
    animation: fadeIn 0.5s ease 0.5s both;
  }
  .success-quote {
    font-size: 14px;
    font-style: italic;
    line-height: 2;
    opacity: 0.8;
    letter-spacing: 1px;
    animation: fadeIn 0.5s ease 0.65s both;
  }
  .success-close {
    margin-top: 40px;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    letter-spacing: 1px;
    animation: fadeIn 0.5s ease 0.8s both;
  }
  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: #2d5a27;
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container" id="formContainer">
  <div class="header">
    <h1>联系我们</h1>
    <p>ALLIUM SEEDS LIMITED · 艾利姆种苗（香港）有限公司</p>
  </div>

  <form id="contactForm">
    <div class="form-group">
      <label for="name">您的姓名 *</label>
      <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
    </div>
    <div class="form-group">
      <label for="contact">联系方式 *</label>
      <input type="text" id="contact" name="contact" placeholder="手机 / 微信 / 邮箱" required>
    </div>
    <div class="form-group">
      <label for="subject">咨询主题</label>
      <input type="text" id="subject" name="subject" placeholder="如：种子采购 / 合作咨询">
    </div>
    <div class="form-group">
      <label for="message">留言内容 *</label>
      <textarea id="message" name="message" placeholder="请详细描述您的需求" required></textarea>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">提 交</button>
    <div id="status" class="status"></div>
  </form>

  <a href="https://www.allium.cn" class="back-link">← 返回首页</a>
</div>

<!-- SUCCESS OVERLAY -->
<div id="successOverlay">
  <div class="success-inner">
    <div class="success-check">✓</div>
    <div class="success-title">提交成功</div>
    <div class="success-subtitle">Submission Received — Thank You</div>
    <div class="success-divider"></div>
    <div class="success-quote">
      God's in His Heaven.<br>
      All's right with the world.
    </div>
    <div class="success-close">页面将在 6 秒后自动关闭</div>
  </div>
</div>

<script>
(function() {
  var form = document.getElementById('contactForm');
  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('status');
  var overlay = document.getElementById('successOverlay');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    var name = document.getElementById('name').value.trim();
    var contact = document.getElementById('contact').value.trim();
    var subject = document.getElementById('subject').value.trim();
    var message = document.getElementById('message').value.trim();

    if (!name || !contact || !message) {
      status.className = 'status error';
      status.textContent = '请填写必填项';
      status.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '提交中...';
    status.style.display = 'none';

    var fd = new FormData();
    fd.append('name', name);
    fd.append('contact', contact);
    fd.append('subject', subject || '(无主题)');
    fd.append('message', [
      '======= 网站访客留言 =======',
      '姓名：' + name,
      '联系方式：' + contact,
      '主题：' + (subject || '(无主题)'),
      '===========================',
      message
    ].join('\n'));

    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://formspree.io/f/mdappypv', true);
    xhr.setRequestHeader('Accept', 'application/json');

    xhr.onload = function() {
      btn.disabled = false;
      btn.textContent = '提 交';
      if (xhr.status === 200) {
        // Success — show overlay
        overlay.classList.add('show');
        // Auto-close after 3 seconds
        setTimeout(function() {
          overlay.classList.remove('show');
          form.reset();
        }, 6000);
      } else if (xhr.status === 422) {
        status.className = 'status error';
        status.textContent = '✗ 表单验证失败，请检查必填项。';
        status.style.display = 'block';
      } else {
        status.className = 'status error';
        status.textContent = '✗ 提交失败（错误码：' + xhr.status + '），请稍后重试。';
        status.style.display = 'block';
      }
    };

    xhr.onerror = function() {
      btn.disabled = false;
      btn.textContent = '提 交';
      status.className = 'status error';
      status.textContent = '✗ 网络连接失败，请检查网络后重试。';
      status.style.display = 'block';
    };

    xhr.send(fd);
  });
})();
</script>
</body>
</html>
