<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 - Contact Us · 艾利姆 Allium</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    padding: 40px;
    width: 100%;
    max-width: 600px;
  }
  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    font-size: 24px;
    color: #2d5a27;
    font-weight: 700;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .header p { color: #888; font-size: 14px; }
  .form-group { margin-bottom: 20px; }
  .form-group label {
    display: block;
    font-size: 14px;
    color: #333;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    outline: none;
    box-sizing: border-box;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #2d5a27;
  }
  .form-group textarea { resize: vertical; min-height: 120px; }
  .btn-submit {
    width: 100%;
    padding: 12px;
    background: #2d5a27;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .btn-submit:hover { background: #3d7a35; }
  .btn-submit:disabled { background: #aaa; cursor: not-allowed; }
  .success-msg {
    margin-top: 16px;
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    font-size: 15px;
    background: #e8f5e9;
    color: #2d5a27;
    display: none;
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: #2d5a27;
    text-decoration: none;
    font-size: 13px;
  }
  .back-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>联系我们</h1>
    <p>ALLIUM SEEDS LIMITED · 艾利姆种苗（香港）有限公司</p>
  </div>

  <!-- Formspree handles redirect to #thanks on success -->
  <form id="contactForm"
        action="https://formspree.io/f/mdappypv"
        method="POST">

    <div class="form-group">
      <label for="name">您的姓名 *</label>
      <input type="text" id="name" name="name" placeholder="请输入您的姓名" required>
    </div>

    <div class="form-group">
      <label for="contact">联系方式 *</label>
      <input type="text" id="contact" name="contact" placeholder="手机 / 微信 / 邮箱" required>
    </div>

    <div class="form-group">
      <label for="subject">咨询主题</label>
      <input type="text" id="subject" name="subject" placeholder="如：种子采购 / 合作咨询">
    </div>

    <div class="form-group">
      <label for="message">留言内容 *</label>
      <textarea id="message" name="message" placeholder="请详细描述您的需求" required></textarea>
    </div>

    <button type="submit" class="btn-submit" id="submitBtn">提 交</button>

    <!-- Success message shown after redirect -->
    <div id="successMsg" class="success-msg">
      ✓ 提交成功！我们将尽快与您联系。
    </div>
  </form>

  <a href="https://www.allium.cn" class="back-link">← 返回首页</a>
</div>

<script>
(function() {
  // Show success message if redirected back from Formspree
  if (window.location.hash === '#thanks') {
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('contactForm').reset();
    window.location.hash = '';
  }
})();
</script>
</body>
</html>
